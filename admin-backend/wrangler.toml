name = "hokkaido-trip-news-api"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

# npx wrangler d1 create hokkaido-trip-news で得たUUIDに置き換えてください。
[[d1_databases]]
binding = "DB"
database_name = "hokkaido-trip-news"
database_id = "REPLACE_WITH_D1_DATABASE_UUID"

# DashboardでR2バインディングを設定する場合も変数名は PHOTOS。
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hokkaido-trip-photos"

# STUDENT_UPLOAD_CODE / ADMIN_PASSWORD / SESSION_SECRET は Cloudflare Secret に保存。
