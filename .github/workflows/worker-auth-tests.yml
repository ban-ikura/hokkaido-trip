name: Worker authorization tests

on:
  pull_request:
    paths:
      - 'admin-backend/**'
      - '.github/workflows/worker-auth-tests.yml'
  push:
    paths:
      - 'admin-backend/**'
      - '.github/workflows/worker-auth-tests.yml'

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authorization regression tests
        working-directory: admin-backend
        run: npm test
